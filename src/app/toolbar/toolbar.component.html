<div class="toolbar" role="toolbar" aria-label="Meeting Copilot toolbar">
  <div class="drag-handle" title="Drag overlay" aria-label="Drag overlay">
    <span></span><span></span><span></span>
  </div>

  <button
    type="button"
    class="listen"
    [class.paused]="!listening()"
    [attr.aria-label]="listening() ? 'Pause listening' : 'Start listening'"
    (click)="toggleListen()"
  >
    @if (listening()) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor" />
        <rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"
        />
      </svg>
    }
  </button>

  <div class="wave" [class.idle]="!listening()" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="sources" [class.on]="listening()" aria-label="Audio source activity">
    <div class="src" [class.live]="micActive()" title="Microphone">
      <span>You</span>
      <i [style.transform]="'scaleY(' + (0.15 + micLevel() * 0.85) + ')'"></i>
    </div>
    <div class="src" [class.live]="systemActive()" title="System audio">
      <span>Sys</span>
      <i [style.transform]="'scaleY(' + (0.15 + systemLevel() * 0.85) + ')'"></i>
    </div>
  </div>

  <div class="timer">{{ elapsed() }}</div>

  <div class="divider" aria-hidden="true"></div>

  <button type="button" class="action" (click)="ask()">
    <span>Ask AI</span>
    <kbd>{{ askLabel() }}</kbd>
  </button>

  <div class="divider" aria-hidden="true"></div>

  <button
    type="button"
    class="chip"
    [class.active]="insightsOpen()"
    (click)="toggleInsights()"
    [attr.aria-pressed]="insightsOpen()"
  >
    Insights
  </button>

  <button
    type="button"
    class="chip"
    [class.active]="responseOpen()"
    (click)="toggleResponse()"
    [attr.aria-pressed]="responseOpen()"
  >
    AI
  </button>

  <div class="divider" aria-hidden="true"></div>

  <button
    type="button"
    class="action hide-btn"
    [class.active]="panelsHidden()"
    (click)="toggleHidePanels()"
    [attr.aria-pressed]="panelsHidden()"
    [attr.aria-label]="panelsHidden() ? 'Show panels' : 'Hide panels'"
  >
    @if (panelsHidden()) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M2.1 3.5 3.5 2.1 21.9 20.5 20.5 21.9l-2.4-2.4A11.6 11.6 0 0 1 12 19c-7 0-10-7-10-7a18.8 18.8 0 0 1 4.3-5.1L2.1 3.5zM12 7a5 5 0 0 1 5 5c0 .7-.1 1.3-.4 1.9l-6.5-6.5c.6-.3 1.2-.4 1.9-.4zm-7.4 4.2 2.2 2.2A3 3 0 0 0 12 15a3 3 0 0 0 1.6-.4l1.7 1.7A11.5 11.5 0 0 1 12 17c-4.1 0-6.8-2.7-8.1-4.4.4-.5 1.1-1.3 2.7-2.4zM14.6 9.1l1.8 1.8c.1-.3.1-.5.1-.8a4.5 4.5 0 0 0-4.5-4.5c-.3 0-.5 0-.8.1l1.5 1.5c.6.1 1.1.5 1.4 1z"
        />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
        />
      </svg>
    }
    <kbd>{{ hideLabel() }}</kbd>
  </button>

  <button
    #moreBtn
    type="button"
    class="icon-btn more-btn"
    aria-label="More options"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu($event)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="5" r="1.6" fill="currentColor" />
      <circle cx="12" cy="12" r="1.6" fill="currentColor" />
      <circle cx="12" cy="19" r="1.6" fill="currentColor" />
    </svg>
  </button>
</div>
