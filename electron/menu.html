<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menu</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .menu {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: grid;
        gap: 2px;
        padding: 6px;
        border-radius: 12px;
        background: rgba(24, 24, 26, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      button {
        text-align: left;
        padding: 10px 12px;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.96);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      button.danger {
        color: #fecaca;
      }
    </style>
  </head>
  <body>
    <div class="menu" role="menu">
      <button type="button" id="settings" role="menuitem">Settings</button>
      <button type="button" id="quit" class="danger" role="menuitem">Quit</button>
    </div>
  </body>
</html>
